name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: Python CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package
        run: npx vsce package --no-dependencies --out structural-merge-resolver.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension/structural-merge-resolver.vsix

  integration:
    name: VS Code integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Configure git for the scratch repositories
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test"
      # VS Code needs a display even headless, and downloads itself on first run.
      - run: xvfb-run -a npm run test:integration

  ui:
    name: Resolver UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Drives the real webview bundle against the real engine and asserts the
      # interaction round trip. Screenshots are kept for inspection on failure.
      - run: node dev/shoot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolver-screenshots
          path: docs/images/*.png
